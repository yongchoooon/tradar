version: "2.4"

services:
  desktop-worker:
    build:
      context: .
      dockerfile: Dockerfile
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python -m worker.main
    working_dir: /app
    volumes:
      - .:/app
      - ${TRADAR_IMAGE_ROOT:-../tradar-data}:/data/images:ro
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tradar_external

networks:
  tradar_external:
    external: true
    name: ${DESKTOP_COMPOSE_NETWORK:-tradar_default}
