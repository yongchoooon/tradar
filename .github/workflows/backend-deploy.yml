name: backend-deploy

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "app/**"
      - "ecs/task-definition.json"
      - ".github/workflows/backend-deploy.yml"

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: tradar-backend

  ECS_CLUSTER: tradar-cluster
  ECS_SERVICE: tradar-backend-svc
  CONTAINER_NAME: tradar-backend

  TASK_DEFINITION_FILE: ecs/task-definition.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Render task definition (replace image)
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          TASK_DEFINITION_FILE: ${{ env.TASK_DEFINITION_FILE }}
        run: |
          set -euo pipefail
          python - << 'PY'
          import json, os

          in_path = os.environ["TASK_DEFINITION_FILE"]
          out_path = "ecs/task-definition.rendered.json"
          image = os.environ["IMAGE_URI"]
          name = os.environ["CONTAINER_NAME"]

          with open(in_path, "r", encoding="utf-8") as f:
            td = json.load(f)

          found = False
          for c in td.get("containerDefinitions", []):
            if c.get("name") == name:
              c["image"] = image
              found = True

          if not found:
            raise SystemExit(
              f'Container name "{name}" not found. '
              f'Check env.CONTAINER_NAME or containerDefinitions in {in_path}'
            )

          with open(out_path, "w", encoding="utf-8") as f:
            json.dump(td, f, indent=2)

          print(out_path)
          PY

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ecs/task-definition.rendered.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
